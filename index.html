<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Carte IAV Hassan II - Madinat Al Irfane</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

	<style>
		html, body { height: 100%; margin: 0; }
		#map { height: 100%; width: 100%; }
	</style>
</head>
<body>

<div id="map"></div>

<script>
	// 1. Carte centrée sur l'IAV Hassan II
	const IAV = [33.9716, -6.8545];
	const map = L.map('map').setView(IAV, 16);

	// 2. Fonds de carte
	const esriRues = L.tileLayer(
		'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
		maxZoom: 19,
		attribution: 'Tiles &copy; Esri'
	}).addTo(map);

	const esriSatellite = L.tileLayer(
		'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
		maxZoom: 19,
		attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
	});

	const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
		maxZoom: 17,
		attribution: '&copy; OpenStreetMap contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
	});

	// 3. Contrôle des couches
	const controleCouches = L.control.layers(
		{ 'Esri Rues': esriRues, 'Esri Satellite': esriSatellite, 'OpenTopoMap': topo },
		{},
		{ collapsed: false }
	).addTo(map);

	// 4. Marqueur IAV
	L.marker(IAV).addTo(map)
		.bindPopup('<b>IAV Hassan II</b><br>Madinat Al Irfane, Rabat');

	// 5. Liste des couches GeoJSON : fichier, nom affiché, style
	const couchesGeoJSON = [
		{
			fichier: 'terrain.geojson',
			nom: 'Terrain',
			style: { color: '#e63946', weight: 2, fillColor: '#e63946', fillOpacity: 0.25 }
		},
		{
			fichier: 'grass.geojson',
			nom: 'Espaces verts',
			style: { color: '#2d6a4f', weight: 1, fillColor: '#52b788', fillOpacity: 0.6 }
		},
		{
			fichier: 'roads.geojson',
			nom: 'Routes',
			style: { color: '#6c757d', weight: 3, opacity: 0.9 }
		},
		{
			fichier: 'iav3D.geojson',
			nom: 'Bâtiments IAV',
			style: { color: '#1d3557', weight: 2, fillColor: '#457b9d', fillOpacity: 0.7 }
		},
		{
			fichier: 'points_iav.geojson',
			nom: 'Points IAV',
			style: { color: '#ffffff', weight: 1, fillColor: '#f77f00', fillOpacity: 0.9 },
			rayon: 6
		}
	];

	// 6. Fonction de chargement générique
	function chargerCouche(cfg) {
		return fetch(cfg.fichier)
			.then(r => {
				if (!r.ok) throw new Error(cfg.fichier + ' : erreur ' + r.status);
				return r.json();
			})
			.then(data => {
				const couche = L.geoJSON(data, {
					style: () => cfg.style,
					pointToLayer: (feature, latlng) =>
						L.circleMarker(latlng, Object.assign({ radius: cfg.rayon || 6 }, cfg.style)),
					onEachFeature: (feature, layer) => {
						const props = feature.properties || {};
						const contenu = Object.entries(props)
							.map(([k, v]) => `<b>${k}</b> : ${v}`)
							.join('<br>');
						layer.bindPopup(`<b>${cfg.nom}</b><br>${contenu}`);
					}
				}).addTo(map);

				controleCouches.addOverlay(couche, cfg.nom);
				return couche;
			});
	}

	// 7. Chargement de toutes les couches
	Promise.allSettled(couchesGeoJSON.map(chargerCouche)).then(resultats => {
		const erreurs = [];
		const tous = L.featureGroup();

		resultats.forEach((res, i) => {
			if (res.status === 'fulfilled') {
				tous.addLayer(res.value);
			} else {
				console.error(res.reason);
				erreurs.push(couchesGeoJSON[i].fichier);
			}
		});

		// Zoom sur l'ensemble des données chargées
		if (tous.getLayers().length > 0 && tous.getBounds().isValid()) {
			map.fitBounds(tous.getBounds());
		}

		if (erreurs.length > 0) {
			alert('Fichiers non chargés : ' + erreurs.join(', '));
		}
	});
</script>

</body>
</html>
